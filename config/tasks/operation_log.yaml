# 4A操作日志表稽核配置（任务化配置）
# 表名: bg_4a_operation_log

# 稽核任务名称（第一级配置）
task_name: "4A操作日志表稽核"

# 表信息配置
table_info:
  name: "operation_log"
  display_name: "4A操作日志表"
  description: "4A系统操作日志数据质量稽核"
  
  # 表名配置
  standard_table: "argus.bg_4a_operation_log_standard"
  error_table: "argus.bg_4a_operation_log_error"
  
  # 字段配置
  time_field: "generic_into_time"
  primary_key: "log_id"
  
  # SQL模板目录
  template_dir: "operation_log"

# 任务列表（任务化配置）
tasks:
  # 任务1：日志ID-唯一性检查
  - task_id: "log_id_uniqueness"
    task_name: "日志ID唯一性检查"
    enabled: true
    sql_template: "operation_log_uniqueness_check"
    params:
      field: "log_id"
      display_name: "日志ID"
  
  # 任务2：日志ID-非空检查
  - task_id: "log_id_null"
    task_name: "日志ID非空检查"
    enabled: true
    sql_template: "operation_log_null_check"
    params:
      field: "log_id"
      display_name: "日志ID"
  
  # 任务3：会话ID-非空检查
  - task_id: "session_id_null"
    task_name: "会话ID非空检查"
    enabled: true
    sql_template: "operation_log_null_check"
    params:
      field: "session_id"
      display_name: "会话ID"
  
  # 任务4：日志来源-枚举值检查
  - task_id: "log_source_enum"
    task_name: "日志来源枚举值检查"
    enabled: true
    sql_template: "operation_log_enum_check"
    params:
      field: "log_source"
      display_name: "日志来源"
  
  # 任务5：日志来源-非空检查
  - task_id: "log_source_null"
    task_name: "日志来源非空检查"
    enabled: true
    sql_template: "operation_log_null_check"
    params:
      field: "log_source"
      display_name: "日志来源"
  
  # 任务6：操作来源-枚举值检查
  - task_id: "operate_source_enum"
    task_name: "操作来源枚举值检查"
    enabled: true
    sql_template: "operation_log_enum_check"
    params:
      field: "operate_source"
      display_name: "操作来源"
  
  # 任务7：操作来源-非空检查
  - task_id: "operate_source_null"
    task_name: "操作来源非空检查"
    enabled: true
    sql_template: "operation_log_null_check"
    params:
      field: "operate_source"
      display_name: "操作来源"
  
  # 任务8：自然人组织路径-非空检查
  - task_id: "natural_org_path_null"
    task_name: "自然人组织路径非空检查"
    enabled: true
    sql_template: "operation_log_null_check"
    params:
